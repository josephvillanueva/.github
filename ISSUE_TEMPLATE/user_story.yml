name: User story
description: A user-facing change, written from the user's point of view
title: "[Story] "
labels: ["type: story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Who needs this, what they want to do, and why.
      placeholder: As a <type of user>, I want <goal> so that <outcome>.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: The problem today, any evidence for it, and constraints.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions. Given / When / Then works well.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this story deliberately does not cover.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P1: next up"
        - "P2: soon"
        - "P3: nice to have"
    validations:
      required: true
