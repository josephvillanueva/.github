name: Bug report
description: Something isn't working as expected
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Android
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks a core flow
        - Degrades a core flow
        - Cosmetic
    validations:
      required: true
